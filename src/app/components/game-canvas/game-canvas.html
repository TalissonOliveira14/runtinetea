<div class="game-container">
  <canvas #renderCanvas></canvas>

  <!-- HUD de Seleção de Avatares -->
  <div class="character-selector">
    <button (click)="changeChar('menino')" class="btn-char menino">👦 Menino</button>
    <button (click)="changeChar('menina')" class="btn-char menina">👧 Menina</button>
    <button (click)="changeChar('cachorro')" class="btn-char cao">🐶 Cão</button>
    <button (click)="changeChar('gato')" class="btn-char gato">🐱 Gato</button>
    <button (click)="changeChar('coelho')" class="btn-char coelho">🐰 Coelho</button>
    <button (click)="changeChar('panda')" class="btn-char panda">🐼 Panda</button>
  </div>

  <!-- Rotina (AGORA / DEPOIS, XP) e controle de toque -->
  <app-hud />
  <app-joystick />
</div>
