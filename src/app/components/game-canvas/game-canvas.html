<div class="game-container">
  <canvas #renderCanvas></canvas>

  @switch (routine.screen()) {
    @case ('start') { <app-start /> }
    @case ('map') { <app-map /> }
    @case ('story') { <app-story /> }
    @case ('play') {
      <app-hud />
      <app-joystick />
    }
    @case ('end') { <app-level-end /> }
  }

  <!-- Aparecem por cima de qualquer tela -->
  @if (routine.calmOpen()) { <app-calm /> }
  @if (routine.settingsOpen()) { <app-settings /> }
</div>
